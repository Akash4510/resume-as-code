name: Compile Resume PDF

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# CRITICAL: This gives the bot permission to push the PDF back to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install RenderCV
        run: pip install "rendercv[full]"

      - name: Render Resumes
        id: render # Gives this step an ID so we can reference its outputs
        run: |
          HAS_ERROR=0
          HAS_SUCCESS=0

          for file in src/resume*.yaml; do
            if python3 -m rendercv render "$file"; then
              HAS_SUCCESS=1 # Flag that at least one built successfully
            else
              HAS_ERROR=1   # Flag that at least one failed
            fi
          done

          # Export the success flag to GitHub Actions outputs
          echo "has_success=$HAS_SUCCESS" >> "$GITHUB_OUTPUT"

          # Fail the step if any errors occurred
          exit $HAS_ERROR

      - name: Upload PDF artifacts
        # CRITICAL: Run even if the step failed, BUT ONLY if at least one PDF exists
        if: always() && steps.render_resumes.outputs.has_success == '1'
        uses: actions/upload-artifact@v4
        with:
          name: compiled-resumes
          path: output/*/*.pdf
          if-no-files-found: ignore

      - name: Commit PDFs to repo
        # CRITICAL: Commit whatever successfully built, BUT ONLY if at least one PDF exists
        if: always() && steps.render_resumes.outputs.has_success == '1'
        run: |
          mkdir -p resumes
          cp output/*/*.pdf resumes/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resumes/*.pdf
          git diff --cached --quiet || git commit -m "chore: auto-compile resumes [skip ci]"
          git push
