# ==========================================
# 🎨 TEMPLATE CONFIG (Do Not Touch Unless Tweaking Design)
# ==========================================
design:
  theme: customtheme

  page:
    size: a4
    top_margin: 1.2cm
    bottom_margin: 1.2cm
    left_margin: 1.27cm
    right_margin: 1.27cm
    show_footer: false
    show_top_note: false

  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)

  typography:
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 30pt
      section_titles: 1.3em
    line_spacing: 0.55em
    alignment: left
    date_and_location_column_alignment: right
    bold:
      name: true
      section_titles: false
    small_caps:
      name: false
      section_titles: true

  links:
    underline: true
    show_external_link_icon: false

  header:
    alignment: center
    space_below_name: 0.4cm
    space_below_connections: 0.4cm
    connections:
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: "|"
      space_between_connections: 0.4cm

  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.2cm
    space_below: 0.1cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 0.8em
    show_time_spans_in: []

  entries:
    date_and_location_width: 4.5cm
    side_space: 0cm
    space_between_columns: 0.1cm
    allow_page_break: true
    short_second_row: true
    degree_width: 0cm
    summary:
      space_left: 0cm
    highlights:
      bullet: "•"
      nested_bullet: "-"
      space_above: 0.15cm
      space_left: 0.3cm
      space_between_items: 0.15cm
      space_between_bullet_and_text: 0.5em

  templates:
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**
        DEGREE, AREA
        HIGHLIGHTS
      degree_column: null
      date_and_location_column: "LOCATION, DATE"
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: |-
        LOCATION
        DATE
    experience_entry:
      main_column: |-
        **COMPANY**
        *POSITION*
        HIGHLIGHTS
      date_and_location_column: |-
        DATE
        *LOCATION*

locale:
  language: english

